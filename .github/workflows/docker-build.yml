name: Build and Push Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: vincenson/moja-app-flask:${{ github.sha }}

      - name: Update Helm values with new tag
        run: |
          sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/" flask-chart/values.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add flask-chart/values.yaml
          git commit -m "Automatyczna aktualizacja tagu obrazu na ${{ github.sha }}" || echo "Brak zmian"
          git push